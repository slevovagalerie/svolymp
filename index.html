<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SVOLYMP · MapTap Liga</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Spline+Sans+Mono:wght@400;500;600&family=Spline+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#0a0e0d;--panel:#13191a;--panel2:#1a2123;--ink:#eef2ef;--dim:#7e8b88;--line:#26302f;--gold:#f5c544;--green:#3ddc84;--teal:#2dd4bf;--red:#ff5a5a;--shadow:0 16px 40px -18px rgba(0,0,0,.7);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Spline Sans',sans-serif;background-image:radial-gradient(circle at 12% 0%,rgba(61,220,132,.08),transparent 42%),radial-gradient(circle at 88% 22%,rgba(45,212,191,.06),transparent 46%);background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 100px}
header{margin-bottom:18px}
.kicker{font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:2.5px;color:var(--green);text-transform:uppercase;margin-bottom:5px}
h1{font-family:'Archivo Black',sans-serif;font-size:clamp(34px,11vw,62px);line-height:.9;letter-spacing:-1.5px;text-transform:uppercase}
h1 .m{color:var(--green)}
.sub{font-family:'Spline Sans Mono',monospace;color:var(--dim);font-size:11.5px;margin-top:8px;line-height:1.5}
.recs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:18px 0}
.rec{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:11px 12px}
.rec .rl{font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.rec .rv{font-weight:700;font-size:14px;margin-top:3px;color:var(--gold)}
.rec .rd{font-family:'Spline Sans Mono';font-size:10px;color:var(--dim);margin-top:1px}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:4px;margin:14px -14px 20px;padding:8px 14px;background:rgba(10,14,13,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{background:none;border:none;color:var(--dim);font-family:'Spline Sans Mono',monospace;font-size:12.5px;padding:8px 13px;cursor:pointer;border-radius:9px;transition:.18s;letter-spacing:.3px;white-space:nowrap;flex:none}
.tab.on{color:#0a0e0d;background:var(--green);font-weight:600}
.view{display:none;animation:fade .35s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:9px;align-items:end;margin-bottom:22px}
.pod{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:16px 8px 14px;text-align:center;position:relative;box-shadow:var(--shadow)}
.pod.p1{border-color:var(--gold);background:linear-gradient(180deg,rgba(245,197,68,.15),var(--panel));transform:translateY(-10px)}
.medal{font-size:28px;margin-bottom:3px}
.pod.p1 .medal{filter:drop-shadow(0 0 10px rgba(245,197,68,.55))}
.pod .name{font-family:'Archivo Black';font-size:clamp(13px,3.6vw,18px);text-transform:uppercase;letter-spacing:-.5px;line-height:1}
.pod .big{font-family:'Spline Sans Mono';font-size:clamp(22px,7vw,34px);font-weight:600;margin:3px 0 0;color:var(--green)}
.pod.p1 .big{color:var(--gold)}
.pod .lbl{font-size:9.5px;color:var(--dim);font-family:'Spline Sans Mono';letter-spacing:.5px;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{font-family:'Spline Sans Mono';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);padding:14px 16px 2px}
.lb{padding:6px 0 8px}
.lrow{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.lrow:last-child{border:none}
.lrank{font-family:'Archivo Black';font-size:16px;color:var(--dim);text-align:center}
.lrow.top .lrank{color:var(--gold)}
.lmain{min-width:0}
.lname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lbarwrap{height:5px;background:var(--panel2);border-radius:3px;margin-top:5px;overflow:hidden}
.lbar{height:100%;border-radius:3px}
.lstat{text-align:right;font-family:'Spline Sans Mono';font-variant-numeric:tabular-nums}
.lstat .v{font-size:19px;font-weight:600}
.lstat .s{font-size:10px;color:var(--dim);letter-spacing:.5px}
.chip{font-family:'Spline Sans Mono';font-size:10px;padding:1px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.flame{color:var(--gold);font-family:'Spline Sans Mono';font-size:12px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th,td{padding:11px 12px;text-align:left;white-space:nowrap}
th{font-family:'Spline Sans Mono';font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);cursor:pointer;position:sticky;top:0;background:var(--panel)}
th.num,td.num{text-align:right;font-family:'Spline Sans Mono';font-variant-numeric:tabular-nums}
tbody tr{border-bottom:1px solid var(--line)}
tbody tr:last-child{border:none}
.pname{font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.scrollhint{font-family:'Spline Sans Mono';font-size:10px;color:var(--dim);padding:0 16px 12px;text-align:center}
.chartbox{padding:16px 10px}
svg{width:100%;height:auto;display:block;overflow:visible}
.lg{display:flex;gap:10px 14px;flex-wrap:wrap;margin-top:12px;padding:0 6px;font-family:'Spline Sans Mono';font-size:11px}
.lg span{display:flex;align-items:center;gap:5px;color:var(--dim);cursor:pointer}
.daysel{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.daysel select{flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:'Spline Sans Mono';font-size:14px}
.daysel button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:18px;cursor:pointer}
.drow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.drow:last-child{border:none}
.drow .pos{font-family:'Archivo Black';width:22px;color:var(--dim);font-size:15px}
.drow.w .pos{color:var(--gold)}
.drow .sc{margin-left:auto;font-family:'Spline Sans Mono';font-size:18px;font-weight:600}
.rounds{font-family:'Spline Sans Mono';font-size:10px;color:var(--dim);letter-spacing:.5px;margin-top:2px}
.killbox{padding:4px 0 8px}
.mgrid{display:grid;grid-template-columns:1fr;gap:12px}
.month-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 16px;box-shadow:var(--shadow)}
.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month-name{font-family:'Archivo Black';font-size:20px;text-transform:uppercase;letter-spacing:-.5px}
.month-champ{font-family:'Spline Sans Mono';font-size:11px;color:var(--gold)}
.mst{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.mst .mr{width:18px;color:var(--dim);font-family:'Spline Sans Mono';font-size:11px}
.mst .mw{margin-left:auto;font-family:'Spline Sans Mono';font-weight:600}
.psel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:7px 14px;font-family:'Spline Sans Mono';font-size:12px;cursor:pointer;transition:.15s}
.pbtn.on{color:#0a0e0d;font-weight:600}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.pstat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}
.pstat .pv{font-family:'Archivo Black';font-size:21px}
.pstat .pk{font-family:'Spline Sans Mono';font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.delta-pos{color:var(--green)}.delta-neg{color:var(--red)}
.hero{background:linear-gradient(145deg,rgba(245,197,68,.12),var(--panel));border:1px solid var(--gold);border-radius:16px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .hm{font-family:'Spline Sans Mono';font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.hero .ht{font-family:'Archivo Black';font-size:clamp(26px,8vw,40px);text-transform:uppercase;letter-spacing:-1px;line-height:1;margin:4px 0 2px}
.hero .hs{font-family:'Spline Sans Mono';font-size:12px;color:var(--dim)}
.story{font-size:14.5px;line-height:1.65;padding:2px 2px 6px}
.story p{margin-bottom:11px}
.story b{color:var(--ink);font-weight:700}
.story .g{color:var(--gold);font-weight:700}
.story .up{color:var(--green);font-weight:600}
.hl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.hlc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.hlc .hk{font-family:'Spline Sans Mono';font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.hlc .hv{font-weight:700;font-size:15px;margin-top:3px}
.hlc .hd{font-family:'Spline Sans Mono';font-size:10px;color:var(--dim);margin-top:1px}
footer{text-align:center;color:var(--dim);font-family:'Spline Sans Mono';font-size:10px;margin-top:30px;letter-spacing:.5px;line-height:1.6}
</style>
</head>

  const F=DATA.form;
  let rows=F.map((f,i)=>{const cls=f.delta>=0?'delta-pos':'delta-neg';const arrow=f.delta>=0?'▲':'▼';return '<div class="lrow"><div class="lrank">'+(i+1)+'</div><div class="lmain"><div class="lname"><span class="dot" style="background:'+COLORS[f.player]+'"></span>'+f.player+'</div><div class="s" style="font-family:Spline Sans Mono;font-size:10px;color:var(--dim);margin-top:3px">posl.10: '+f.recent+' · celkem ⌀'+f.avg+'</div></div><div class="lstat"><div class="v '+cls+'">'+arrow+' '+Math.abs(f.delta)+'</div><div class="s">vs průměr</div></div></div>';}).join('');
  document.getElementById('form').innerHTML='<div class="card"><h3>Forma — posledních 10 her vs celkový průměr</h3><div class="lb">'+rows+'</div></div><div class="sub" style="padding:0 4px">▲ zelená = teď hraje líp než obvykle · ▼ červená = pokles formy</div>';
}
let curPlayer=null;
function renderPlayer(){
  if(!curPlayer)curPlayer=[...P].sort((a,b)=>S[b].games-S[a].games)[0];
  let btns=P.map(p=>'<button class="pbtn '+(p===curPlayer?'on':'')+'" style="'+(p===curPlayer?'background:'+COLORS[p]+';border-color:'+COLORS[p]:'')+'" data-p="'+p+'">'+p+'</button>').join('');
  const ser=DATA.series[curPlayer],s=S[curPlayer],c=COLORS[curPlayer];
  const W=700,H=300,pad=34,n=ser.length;
  const ys=ser.map(x=>x.score),mn=Math.min(...ys)-20,mx=Math.max(...ys)+10;
  const xf=i=>pad+(W-2*pad)*(n<2?0:i/(n-1)),yf=v=>H-pad-(H-2*pad)*(v-mn)/(mx-mn);
  let ma=ser.map((_,i)=>{let a=ser.slice(Math.max(0,i-4),i+1);return a.reduce((s,x)=>s+x.score,0)/a.length;});
  let line=ser.map((x,i)=>(i?'L':'M')+xf(i).toFixed(1)+' '+yf(x.score).toFixed(1)).join(' ');
  let maline=ma.map((v,i)=>(i?'L':'M')+xf(i).toFixed(1)+' '+yf(v).toFixed(1)).join(' ');
  let best=ser.reduce((a,b)=>b.score>a.score?b:a,ser[0]);let bi=ser.indexOf(best);
  let grid='';for(let g=0;g<5;g++){let v=mn+(mx-mn)*g/4;grid+='<line x1="'+pad+'" y1="'+yf(v)+'" x2="'+(W-pad)+'" y2="'+yf(v)+'" stroke="var(--line)"/><text x="'+(pad-6)+'" y="'+(yf(v)+3)+'" fill="var(--dim)" font-size="10" text-anchor="end" font-family="Spline Sans Mono">'+Math.round(v)+'</text>';}
  let dots='<circle cx="'+xf(bi)+'" cy="'+yf(best.score)+'" r="5" fill="var(--gold)"/><text x="'+xf(bi)+'" y="'+(yf(best.score)-10)+'" fill="var(--gold)" font-size="11" text-anchor="middle" font-family="Spline Sans Mono">PB '+best.score+'</text>';
  let svg='<svg viewBox="0 0 '+W+' '+H+'">'+grid+'<path d="'+line+'" fill="none" stroke="'+c+'" stroke-width="1.5" opacity=".45"/><path d="'+maline+'" fill="none" stroke="'+c+'" stroke-width="3" stroke-linejoin="round"/>'+dots+'</svg>';
  document.getElementById('player').innerHTML='<div class="psel">'+btns+'</div><div class="pstats"><div class="pstat"><div class="pv" style="color:'+c+'">'+s.games+'</div><div class="pk">her</div></div><div class="pstat"><div class="pv" style="color:'+c+'">'+s.avg+'</div><div class="pk">průměr</div></div><div class="pstat"><div class="pv" style="color:var(--gold)">'+s.max+'</div><div class="pk">osobák</div></div><div class="pstat"><div class="pv" style="color:'+c+'">'+s.wins+'</div><div class="pk">výher</div></div><div class="pstat"><div class="pv" style="color:'+c+'">'+s.recent+'</div><div class="pk">forma</div></div><div class="pstat"><div class="pv" style="color:'+c+'">'+s.perfect+'</div><div class="pk">kol ≥99</div></div></div><div class="card"><h3>Skóre v čase · '+curPlayer+' (tučná čára = klouzavý průměr z 5 her)</h3><div class="chartbox">'+svg+'</div></div>';
  document.querySelectorAll('#player .pbtn').forEach(b=>b.onclick=()=>{curPlayer=b.dataset.p;renderPlayer();});
}
let sk='avg',sd=-1;
function renderStats(){
  const cols=[['player','Hráč',0],['games','Her',1],['avg','⌀',1],['median','Med',1],['max','Max',1],['min','Min',1],['wins','Výhry',1],['win_rate','%',1],['streak','Rekord',1],['cur_streak','Teď',1],['recent','Forma',1],['perfect','Kol≥99',1]];
  const r=[...P].sort((a,b)=>{let x=sk==='player'?a:S[a][sk],y=sk==='player'?b:S[b][sk];return sk==='player'?sd*(''+x).localeCompare(y):sd*(x-y);});
  let head=cols.map(c=>'<th class="'+(c[2]?'num':'')+'" data-k="'+c[0]+'">'+c[1]+(sk===c[0]?(sd<0?'▾':'▴'):'')+'</th>').join('');
  let rows=r.map(p=>{const s=S[p];return '<tr><td><div class="pname"><span class="dot" style="background:'+COLORS[p]+'"></span>'+p+'</div></td><td class="num">'+s.games+'</td><td class="num" style="color:var(--green);font-weight:600">'+s.avg+'</td><td class="num">'+s.median+'</td><td class="num">'+s.max+'</td><td class="num">'+s.min+'</td><td class="num">'+s.wins+'</td><td class="num">'+s.win_rate+'%</td><td class="num">'+s.streak+'</td><td class="num">'+s.cur_streak+'</td><td class="num">'+s.recent+'</td><td class="num">'+s.perfect+'</td></tr>';}).join('');
  document.getElementById('stats').innerHTML='<div class="card"><h3>Kompletní statistiky</h3><div class="scroll"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div><div class="scrollhint">← potáhni do strany · klepni na záhlaví pro řazení →</div></div>';
  document.querySelectorAll('#stats th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sk===k)sd*=-1;else{sk=k;sd=k==='player'?1:-1;}renderStats();});
}
function renderRace(){
  const T=DATA.timeline,W=700,H=380,pad=34,n=T.length;
  const mY=Math.max(...P.map(p=>S[p].wins));
  const x=i=>pad+(W-2*pad)*i/(n-1),y=v=>H-pad-(H-2*pad)*v/mY;
  let paths=P.map(p=>'<path d="'+T.map((t,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(t[p]).toFixed(1)).join(' ')+'" fill="none" stroke="'+COLORS[p]+'" stroke-width="2.5" stroke-linejoin="round"/>').join('');
  let dots=P.map(p=>'<circle cx="'+x(n-1)+'" cy="'+y(T[n-1][p])+'" r="3.5" fill="'+COLORS[p]+'"/>').join('');
  let grid='';const step=Math.ceil(mY/5);
  for(let g=0;g<=mY;g+=step)grid+='<line x1="'+pad+'" y1="'+y(g)+'" x2="'+(W-pad)+'" y2="'+y(g)+'" stroke="var(--line)"/><text x="'+(pad-6)+'" y="'+(y(g)+3)+'" fill="var(--dim)" font-size="10" text-anchor="end" font-family="Spline Sans Mono">'+g+'</text>';
  const lg=[...P].sort((a,b)=>S[b].wins-S[a].wins).map(p=>'<span><span class="dot" style="background:'+COLORS[p]+'"></span>'+p+' '+S[p].wins+'</span>').join('');
  document.getElementById('race').innerHTML='<div class="card"><h3>Kumulativní výhry v čase</h3><div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'">'+grid+paths+dots+'</svg><div class="lg">'+lg+'</div></div></div>';
}
function renderKiller(){
  const K=DATA.killer,mx=Math.max(...Object.values(K));
  let rows=Object.keys(K).map((p,i)=>'<div class="lrow"><div class="lrank">'+(i+1)+'</div><div class="lmain"><div class="lname"><span class="dot" style="background:'+COLORS[p]+'"></span>'+p+'</div><div class="lbarwrap"><div class="lbar" style="width:'+(100*K[p]/mx)+'%;background:'+COLORS[p]+'"></div></div></div><div class="lstat"><div class="v">'+K[p]+'×</div><div class="s">porazil krále</div></div></div>').join('');
  document.getElementById('killer').innerHTML='<div class="card"><h3>Kdo porazil Tomáše P. (král s '+S['Tomáš P.'].wins+' výhrami)</h3><div class="killbox">'+rows+'</div></div><div class="sub" style="padding:0 4px">Dny, kdy hráli oba a soupeř měl vyšší skóre. Tomášova nemesis neexistuje — nikdo proti němu nemá kladnou bilanci.</div>';
}
function renderDaily(){
  const days=DATA.daily;
  let opts=days.map((d,i)=>'<option value="'+i+'">'+d.date+'</option>').reverse().join('');
  document.getElementById('daily').innerHTML='<div class="daysel"><button id="pd">‹</button><select id="ds">'+opts+'</select><button id="nd">›</button></div><div class="card" id="dc"></div>';
  const sel=document.getElementById('ds');sel.value=days.length-1;
  function show(){const d=days[+sel.value],top=d.results[0].score;let rows=d.results.map((r,i)=>'<div class="drow '+(r.score===top?'w':'')+'"><span class="pos">'+(i+1)+'</span><div class="lmain"><div class="lname" style="font-size:14px"><span class="dot" style="background:'+COLORS[r.player]+'"></span>'+r.player+' '+(r.score===top?'🥇':'')+'</div>'+(r.rounds.length?'<div class="rounds">'+r.rounds.join(' · ')+'</div>':'')+'</div><span class="sc" style="color:'+(r.score===top?'var(--gold)':'var(--ink)')+'">'+r.score+'</span></div>').join('');document.getElementById('dc').innerHTML='<h3>'+d.date+' · '+d.results.length+' hráčů</h3>'+rows;}
  sel.onchange=show;
  document.getElementById('pd').onclick=()=>{if(+sel.value>0){sel.value=+sel.value-1;show();}};
  document.getElementById('nd').onclick=()=>{if(+sel.value<days.length-1){sel.value=+sel.value+1;show();}};
  show();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');const v=t.dataset.v;document.getElementById(v).classList.add('on');
  if(v==='race')renderRace();if(v==='player')renderPlayer();
  window.scrollTo({top:0,behavior:'smooth'});
});
renderOverall();renderThisMonth();renderMonthly();renderForm();renderStats();renderKiller();renderDaily();
</script>
</body>
